name: Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - "themes/**/*"
      - "plugins/**/*"
      - ".github/workflows/*.yml"
      - "bin/**/*"
  workflow_dispatch:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: read-all
    timeout-minutes: 120

    env:
      NODE_OPTIONS: "--max_old_space_size=8192"
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      YARN_CHECKSUM_BEHAVIOR: update
      TERM: xterm

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: master
          repository: dimaslanjaka/hexo-themes
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: dimaslanjaka/hexo-themes
          path: .deploy_git
          ref: gh-pages
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: "**/package.json"

      - name: Enable Corepack
        run: |
          corepack enable
          yarn -v

      - name: Verify environment
        run: |
          node -v
          npm -v
          yarn -v

      - name: Update submodules
        run: |
          echo "init submodules"
          git submodule init
          git submodule foreach "git submodule init"

          echo "sync submodules"
          git submodule sync
          git submodule foreach "git submodule sync"

          echo "update submodules"
          yarn dlx rimraf .git/modules
          yarn dlx binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz submodule-install

      - name: Initialize cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            **/node_modules
            ~/.cache/yarn
            ./.yarn/cache*
            ./.yarn/*.gz
            **/dist
            **/.yarn/cache*
            **/tmp
            db.json
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package.json', '**/themes/**/*.cjs', '**/themes/**/*.js', '**/themes/**/*.ts', '**/themes/**/*.scss', '**/themes/**/*.njk', '**/themes/**/*.pug', '**/themes/**/*.styl') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: npm run build

      - name: Switch hexo-theme-flowbite
        run: node bin/switch-theme flowbite

      - name: Build site
        run: npm run site:build

      - name: Deploy github pages
        run: node bin/deploy
        shell: bash
